name: Branch Protection Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, edited, dismissed]
  status: {}

jobs:
  branch-protection:
    name: Enforce Branch Protection
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Check if PR targets main
      run: |
        if [ "${{ github.base_ref }}" != "main" ]; then
          echo "::warning::PR is not targeting main branch"
          echo "::warning::Ensure PR targets main for merge"
        fi
        
    - name: Check for required reviews
      run: |
        echo "Checking for required reviews..."
        echo "Base branch: ${{ github.base_ref }}"
        echo "PR number: ${{ github.event.number }}"
        
    - name: Verify CI status
      uses: mheap/github-action-ensure-label-on-issue@main
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        label: 'CI Passed'
        
    - name: Check PR description
      run: |
        if [ -z "${{ github.event.pull_request.body }}" ]; then
          echo "::error::PR must have a description"
          exit 1
        fi
        
    - name: Check for linked issues
      run: |
        PR_BODY="${{ github.event.pull_request.body }}"
        if ! echo "$PR_BODY" | grep -qi "fixes\|closes\|resolves\|#[0-9]"; then
          echo "::warning::Consider linking related issues in PR description"
        fi
        
    - name: Verify no breaking changes without discussion
      run: |
        TITLE="${{ github.event.pull_request.title }}"
        if echo "$TITLE" | grep -qi "!\|breaking\|major"; then
          echo "::warning::Breaking changes should be discussed in an issue first"
        fi

  status-check:
    name: Required Status Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Create status check
      uses: actions/github-script@v7
      with:
        script: |
          const { data: pulls } = await github.rest.pulls.list({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            base: 'main'
          });
          
          if (pulls.length === 0) {
            console.log('No open PRs to main');
            return;
          }
          
          for (const pull of pulls) {
            const sha = pull.head.sha;
            
            try {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: sha,
                state: 'pending',
                context: 'branch-protection',
                description: 'Checking branch protection requirements',
                target_url: 'https://github.com/${context.repo.owner}/${context.repo.repo}/actions'
              });
              
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: sha,
                state: 'success',
                context: 'branch-protection',
                description: 'Branch protection checks passed'
              });
            } catch (error) {
              console.error('Error creating status check:', error);
            }
          }
        github-token: ${{ secrets.GITHUB_TOKEN }}

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Check TypeScript types
      run: npm run build
      
    - name: Check for console errors
      run: |
        echo "Checking for common error patterns..."
        grep -r "console\.(error|warn)" src/ || echo "No console errors/warnings found"
      
    - name: Check for TODO comments
      run: |
        TODO_COUNT=$(grep -r "TODO" src/ | wc -l)
        echo "Found $TODO_COUNT TODO comments"
        if [ $TODO_COUNT -gt 0 ]; then
          echo "::warning::$TODO_COUNT TODO comments found in codebase"
        fi
        
    - name: Check for debug statements
      run: |
        DEBUG_COUNT=$(grep -r "console.log\|debugger" src/ | grep -v "tests/" | wc -l)
        echo "Found $DEBUG_COUNT debug statements"
        if [ $DEBUG_COUNT -gt 0 ]; then
          echo "::warning::$DEBUG_COUNT debug statements found - remove before merging"
        fi
        
    - name: Check file sizes
      run: |
        MAX_SIZE_KB=500
        for file in src/*.ts; do
          size=$(wc -c < "$file")
          size_kb=$((size / 1024))
          if [ $size_kb -gt $MAX_SIZE_KB ]; then
            echo "::warning::$file is larger than ${MAX_SIZE_KB}KB (${size_kb}KB)"
          fi
        done
